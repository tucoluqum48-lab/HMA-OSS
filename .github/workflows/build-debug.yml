name: BuildDebug
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare local.properties
        run: |
          printf 'sdk.dir=/usr/local/lib/android/sdk\nofficialBuild=false\n' > local.properties
          cat local.properties
      - name: Prebuild
        run: |
          chmod +x gradlew
          ./gradlew prebuild --no-daemon
      - name: Build app + module
        run: |
          ./gradlew :app:assemble :zygote:assemble --no-daemon --stacktrace
      - name: List outputs
        run: |
          find zygote/build/outputs -name '*.zip' 2>/dev/null | head
          find app/build/outputs -name '*.apk' 2>/dev/null | head
      - uses: actions/upload-artifact@v4
        with:
          name: HMA-module
          path: |
            zygote/build/outputs/magisk/**/*.zip
            app/build/outputs/apk/**/*.apk
